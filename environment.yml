# 实验一运行环境（版本与实际运行时一致）
#   conda env create -f environment.yml
#   conda activate project1
name: project1
channels:
  - defaults
dependencies:
  - python=3.10.21
  - numpy=2.2.5
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - scipy=1.15.3
  - matplotlib=3.10.9
  - joblib=1.5.3
  - threadpoolctl=3.5.0
  - nltk=3.10.3        # 只有 experiments/preprocess_ablation.py 的词干化对照用到
